name: Swagger Release Sync

env:
  EDGE_GRAPHQL_REPO: AniTrend/edge-graphql
  EDGE_GRAPHQL_REF: main
  EDGE_GRAPHQL_WORKFLOW: publish-snapshot.yml

on:
  pull_request:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build swagger from"
        required: false

permissions:
  contents: read

jobs:
  generate-and-dispatch:
    name: Generate swagger and dispatch
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://localhost:27017/on-the-edge
      REDIS_URL: redis://localhost:6379
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            tag="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            tag="${{ github.head_ref }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: 2.6.8
      - name: Config properties file
        run: bash .github/scripts/config-env.sh
      - name: Validate CI env defaults
        run: |
          grep '^MONGO_URL=' .env | tail -n 1
          grep '^REDIS_URL=' .env | tail -n 1
      - name: Generate swagger spec
        run: deno task swagger:generate
      - name: Upload swagger spec artifact
        uses: actions/upload-artifact@v7
        with:
          name: swagger-spec
          path: .github/swagger-spec.json
          if-no-files-found: error
      - name: Dispatch edge-graphql workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ env.EDGE_GRAPHQL_REPO }}
          event-type: trigger-action
