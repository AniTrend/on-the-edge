name: Swagger Release Sync

on:
  workflow_run:
    workflows: ["Release Drafter"]
    types:
      - completed
    branches:
      - dev
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build swagger from"
        required: false

permissions:
  contents: read

jobs:
  prepare-swagger-asset:
    name: Generate swagger and publish asset
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://localhost:27017/on-the-edge
      REDIS_URL: redis://localhost:6379
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Get latest draft release tag
        if: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '') }}
        id: release-tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="$(gh release list --repo "AniTrend/on-the-edge" --limit 5 --json tagName,isDraft,createdAt --jq 'map(select(.isDraft == true)) | (.[0].tagName // empty)')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Resolve tag
        id: tag
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            tag="${{ github.event.inputs.tag }}"
          elif [[ -n "${{ steps.release-tag.outputs.tag }}" ]]; then
            tag="${{ steps.release-tag.outputs.tag }}"
          else
            echo "No release tag provided and no draft release tag found"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: 2.9.3
      - name: Config properties file
        run: bash .github/scripts/config-env.sh
      - name: Generate swagger spec
        run: deno task swagger:generate
      - name: Validate swagger spec
        run: deno task swagger:validate
      - name: Upload swagger spec artifact
        uses: actions/upload-artifact@v7
        with:
          name: swagger-spec
          path: .github/swagger-spec.json
          if-no-files-found: error
      - name: Publish swagger spec to release asset
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          asset_path=".github/swagger-spec.json"
          asset_name="swagger-spec.json"

          gh release upload "$tag" --clobber "$asset_path#$asset_name"

  dispatch-edge-graphql:
    name: Dispatch edge-graphql on release publish
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: AniTrend
          repositories: edge-graphql
      - name: Dispatch edge-graphql workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: AniTrend/edge-graphql
          event-type: trigger-workflow
          client-payload: >-
            {
              "base_branch": "main",
              "release_repo": "AniTrend/on-the-edge",
              "release_tag": "${{ github.event.release.tag_name }}",
              "release_asset": "swagger-spec.json"
            }
