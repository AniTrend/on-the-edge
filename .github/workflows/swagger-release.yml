name: Swagger Release Sync

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build swagger from"
        required: false

permissions:
  contents: read

jobs:
  generate-and-dispatch:
    name: Generate swagger and dispatch
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://localhost:27017/on-the-edge
      REDIS_URL: redis://localhost:6379
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: AniTrend
          repositories: edge-graphql
      - name: Resolve tag
        id: tag
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            tag="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            tag="${{ github.head_ref }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: 2.6.8
      - name: Config properties file
        run: bash .github/scripts/config-env.sh
      - name: Generate swagger spec
        continue-on-error: true
        run: deno task swagger:generate
      - name: Upload swagger spec artifact
        uses: actions/upload-artifact@v7
        with:
          name: swagger-spec
          path: .github/swagger-spec.json
          if-no-files-found: error
      - name: Dispatch edge-graphql workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: AniTrend/edge-graphql
          event-type: trigger-workflow
          client-payload: >-
            {
              "base_branch": "main",
              "release_repo": "AniTrend/on-the-edge",
              "release_tag": "${{ startsWith(github.ref, 'refs/tags/') && steps.tag.outputs.tag || 'latest' }}",
              "release_asset": "swagger-spec.json"
            }
