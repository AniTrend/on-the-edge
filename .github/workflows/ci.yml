name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: 2.9.5
      - name: Config properties file
        run: bash .github/scripts/config-env.sh
      - name: Run lint checks
        run: deno lint

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: 2.9.5
      - name: Config properties file
        run: bash .github/scripts/config-env.sh
      - name: Check code format
        run: deno fmt --check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: 2.9.5
      - name: Config properties file
        run: bash .github/scripts/config-env.sh
      - name: Run checks
        run: deno task check

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-check, format-check, type-check]
    steps:
      - name: Setup repo
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: 2.9.5
      - name: Config properties file
        run: bash .github/scripts/config-env.sh
      - name: Run tests
        run: deno task test

  contract-check:
    name: Swagger Contract Check
    runs-on: ubuntu-latest
    needs: unit-test
    env:
      MONGO_URL: mongodb://localhost:27017/on-the-edge
      REDIS_URL: redis://localhost:6379
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Setup repo
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: 2.9.5
      - name: Config properties file
        run: bash .github/scripts/config-env.sh
      - name: Generate swagger spec
        run: deno task swagger:generate
      - name: Validate swagger spec
        run: deno task swagger:validate

  build-matrix:
    name: Build Matrix Test
    runs-on: ${{ matrix.os }}
    needs: unit-test
    strategy:
      matrix:
        os: [ubuntu-latest]
        architecture: [x64, arm64]
      fail-fast: true
    steps:
      - name: Setup repo
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: 2.9.5
      - name: Config properties file
        run: bash .github/scripts/config-env.sh
      - name: Compile Application
        run: deno task build

  deployment-ready:
    name: Deployment Ready Check
    runs-on: ubuntu-latest
    needs: [unit-test, build-matrix]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set deployment status
        run: |
          echo "DEPLOYMENT_READY=true" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
