name: CI/CD Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
  contents: read


jobs:
  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
      - name: Config properties file
        run: bash .github/scripts/config-env.sh
      - name: Run lint checks
        run: deno lint
  
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
      - name: Config properties file
        run: bash .github/scripts/config-env.sh
      - name: Check code format
        run: deno fmt --check
  
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
      - name: Config properties file
        run: bash .github/scripts/config-env.sh
      - name: Run checks
        run: deno task check
  
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-check, format-check, type-check]
    steps:
      - name: Setup repo
        uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
      - name: Config properties file
        run: bash .github/scripts/config-env.sh
      - name: Run tests
        run: deno task test
  
  build-matrix:
    name: Build Matrix Test
    runs-on: ${{ matrix.os }}
    needs: unit-test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        architecture: [x64, arm64]
      fail-fast: true
    steps:
      - name: Setup repo
        uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
      - name: Config properties file
        run: bash .github/scripts/config-env.sh
      - name: Compile Application
        run: deno task build

  deployment-ready:
    name: Deployment Ready Check
    runs-on: ubuntu-latest
    needs: [unit-test, build-matrix]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set deployment status
        run: |
          echo "DEPLOYMENT_READY=true" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_ENV